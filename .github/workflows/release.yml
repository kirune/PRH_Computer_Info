name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tagVersion = "${env:GITHUB_REF_NAME}" -replace '^v', '' -replace '-.*$', ''
          $csprojVersion = (Select-String -Path 'ComputerInfo.csproj' -Pattern '<Version>(.*)</Version>').Matches.Groups[1].Value
          if ($tagVersion -ne $csprojVersion) {
            Write-Error "Tag '$env:GITHUB_REF_NAME' (parsed as $tagVersion) does not match <Version>$csprojVersion</Version> in ComputerInfo.csproj. Bump the csproj Version before tagging a release."
            exit 1
          }
          Write-Host "Tag version $tagVersion matches csproj version $csprojVersion"

      - name: Publish (framework-dependent)
        run: dotnet publish ComputerInfo.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Publish (self-contained, .NET included)
        run: dotnet publish ComputerInfo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-selfcontained

      - name: Rename self-contained exe
        shell: pwsh
        run: Rename-Item -Path 'publish-selfcontained\ComputerInfo.exe' -NewName 'ComputerInfo-selfcontained.exe'

      - name: Zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "ComputerInfo-${env:GITHUB_REF_NAME}-win-x64.zip"
          Compress-Archive -Path publish-selfcontained\* -DestinationPath "ComputerInfo-${env:GITHUB_REF_NAME}-win-x64-selfcontained.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ComputerInfo-*-win-x64.zip
            ComputerInfo-*-win-x64-selfcontained.zip
            publish/ComputerInfo.exe
            publish-selfcontained/ComputerInfo-selfcontained.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update internal winget manifest
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', '' -replace '-.*$', ''
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path 'publish\ComputerInfo.exe').Hash.ToLower()
          $installerUrl = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/${env:GITHUB_REF_NAME}/ComputerInfo.exe"
          $destDir = "manifests\p\prh\computerinfo\$version"

          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main

          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $template = Get-Content 'manifests\_template\PRH.ComputerInfo.template.yaml' -Raw
          $rendered = $template.Replace('__VERSION__', $version).Replace('__INSTALLER_URL__', $installerUrl).Replace('__INSTALLER_SHA256__', $sha256)
          Set-Content -Path "$destDir\PRH.ComputerInfo.yaml" -Value $rendered -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destDir\PRH.ComputerInfo.yaml"

          $status = git status --porcelain
          if ($status) {
            git commit -m "Add winget manifest for $version ($env:GITHUB_REF_NAME) [skip ci]"
            git push origin main
          } else {
            Write-Host "Manifest for $version already up to date, nothing to commit."
          }
